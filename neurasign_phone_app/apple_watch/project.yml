name: NeurasignWatch
options:
  bundleIdPrefix: com.neurasign.link
settings:
  base:
    SWIFT_VERSION: '5.9'
targets:
  NeurasignWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neurasign.link.watchapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: '4'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.neurasign.link
        INFOPLIST_KEY_CFBundleDisplayName: NEURASIGN Link
        INFOPLIST_KEY_NSHealthShareUsageDescription: Read available heart-rate samples while wearable sharing is active.
        INFOPLIST_KEY_NSMotionUsageDescription: Share watch motion measurements with your linked company.
        CODE_SIGN_ENTITLEMENTS: Watch.entitlements
    dependencies:
      - sdk: HealthKit.framework
      - sdk: CoreMotion.framework
      - sdk: WatchConnectivity.framework
