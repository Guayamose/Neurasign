plugins { id 'com.android.application' }
android {
  namespace 'com.neurasign.link'
  compileSdk 36
  defaultConfig { applicationId 'com.neurasign.link'; minSdk 30; targetSdk 35; versionCode 1; versionName '0.1.0' }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  signingConfigs {
    debug {
      // Data Layer requires the exact same package and certificate as the phone.
      storeFile file('../../mobile/android/app/debug.keystore')
      storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
    }
  }
  buildTypes { release { signingConfig signingConfigs.debug; minifyEnabled false } }
}
dependencies {
  implementation 'com.google.android.gms:play-services-wearable:20.0.1'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
  def samsungAar = System.getenv('SAMSUNG_SENSOR_AAR')
  if (samsungAar) {
    if (!file(samsungAar).isFile()) throw new GradleException('SAMSUNG_SENSOR_AAR must reference the official downloaded AAR.')
    implementation files(samsungAar)
  }
  if (project.hasProperty('requireSamsung') && !samsungAar) throw new GradleException('Samsung build requires the official Samsung Health Sensor SDK AAR. Download it using your Samsung developer account and set SAMSUNG_SENSOR_AAR.')
}
