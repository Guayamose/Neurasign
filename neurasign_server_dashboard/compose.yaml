name: neurasign

services:
  emulator:
    build:
      context: .
      dockerfile: infra/local/Dockerfile
    ports:
      - "127.0.0.1:9099:9099"
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:4000:4000"
    volumes:
      - emulator-state:/app/state
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9099/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NEURASIGN_ENV: local
      FIREBASE_PROJECT_ID: demo-neurasign
      FIREBASE_WEB_API_KEY: demo-key
      FIREBASE_AUTH_DOMAIN: localhost
      FIREBASE_AUTH_EMULATOR_HOST: emulator:9099
      FIREBASE_AUTH_EMULATOR_URL: http://localhost:9099
      WORKSPACE_STORE: firestore
      FIRESTORE_EMULATOR_HOST: emulator:8080
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/universe:/app/data/universe:ro
    depends_on:
      emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  emulator-state:
